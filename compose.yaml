name: metro-motion

services:
  app:
    image: ghcr.io/mapherez/metro-motion-app:${APP_IMAGE_TAG:-1.0.1}
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      METRO_API_BASE: ${METRO_API_BASE:-https://api.metrolisboa.pt:8243/estadoServicoML/1.0.1/}
      METRO_API_KEY: ${METRO_API_KEY:-}
      METRO_MOCK: ${METRO_MOCK:-0}
      METRO_MOCK_FILE: /app/fixtures/metro.json
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-2000}
      DWELL_SECONDS: ${DWELL_SECONDS:-25}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-15}
      FRONTEND_DIST_DIR: /app/frontend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
